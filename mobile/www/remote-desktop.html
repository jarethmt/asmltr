<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>asmltr — remote desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="rd">
  <header class="bar">
    <button id="rdBack" class="icon" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="brand">Remote desktop</div>
    <div class="right">
      <span id="rdStatus" class="pill pill-off">offline</span>
      <button id="rdRefresh" class="icon" aria-label="Refresh hosts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button id="rdSettingsBtn" class="icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.34 8.5a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <!-- host discovery -->
  <main id="rdList" class="rd-list">
    <p id="rdListMsg" class="msg">Discovering hosts…</p>
    <div id="rdHosts" class="rd-hosts"></div>
  </main>

  <!-- live session: full-screen video + control overlay + toolbar -->
  <section id="rdStage" class="rd-stage hidden">
    <video id="rdVideo" class="rd-video" autoplay playsinline></video>
    <!-- transparent gesture layer; only captures pointer events when control is granted (see .active) -->
    <div id="rdControl" class="rd-control"></div>
    <span id="rdCtlBadge" class="rd-ctl-badge hidden">CONTROL</span>

    <div class="rd-toolbar">
      <span id="rdStageName" class="rd-stage-name">host</span>
      <div class="rd-tools">
        <button id="rdKbBtn" class="rd-tool hidden" aria-label="Keyboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
        </button>
        <button id="rdMuteBtn" class="rd-tool" aria-label="Toggle audio">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13 3a3.5 3.5 0 0 0-2-3.15v6.3A3.5 3.5 0 0 0 16 12z"/></svg>
        </button>
        <button id="rdPipBtn" class="rd-tool" aria-label="Picture-in-picture">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
        </button>
        <button id="rdMinBtn" class="rd-tool" aria-label="Minimize">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 17h12"/></svg>
        </button>
        <button id="rdDisconnect" class="rd-tool danger" aria-label="Disconnect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <!-- hidden input drives the soft keyboard; keystrokes are relayed over the control data channel -->
    <input id="rdKbInput" class="rd-kb-input hidden" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Remote keyboard" />
  </section>

  <!-- settings -->
  <div id="rdSheet" class="sheet hidden">
    <div class="sheet-card">
      <h2>Remote desktop broker</h2>
      <label>Broker URL<input id="rdCfgUrl" placeholder="https://your-asmltr-host:3028" inputmode="url" autocapitalize="off" /></label>
      <label>Token<input id="rdCfgToken" placeholder="paste your device token" /></label>
      <label>Client id<input id="rdCfgClient" readonly /></label>
      <div class="row"><button id="rdCfgTest" class="secondary">Test</button><button id="rdCfgSave" class="primary">Save</button></div>
      <p id="rdCfgMsg" class="msg"></p>
      <div class="row"><button id="rdCfgClose" class="secondary">Close</button></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script type="module" src="remote-desktop.js"></script>
</body>
</html>
