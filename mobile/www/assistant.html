<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>asmltr assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand"><span id="agentName">assistant</span></div>
    <div class="right">
      <span id="status" class="pill pill-off">offline</span>
      <button id="settingsBtn" class="icon" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="log" class="log" aria-live="polite"></main>

  <footer class="controls">
    <button id="talk" class="talk" aria-label="Talk">
      <span class="mic">🎙</span>
      <span id="talkLabel" class="talkLabel">Tap to talk</span>
    </button>
    <div class="kbdrow">
      <input id="kbd" class="kbd" type="text" enterkeyhint="send" autocomplete="off"
             autocapitalize="sentences" placeholder="Type a message…" />
      <button id="kbdSend" class="kbdSend" aria-label="Send">➤</button>
    </div>
  </footer>

  <!-- Settings sheet -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-card">
      <h2>Connection</h2>
      <label>Server URL<input id="cfgUrl" placeholder="https://your-asmltr-host/app" /></label>
      <label>Device token<input id="cfgToken" placeholder="paste your device token" /></label>
      <label>Display name<input id="cfgName" placeholder="My Pixel" /></label>
      <label>Device id<input id="cfgDevice" readonly /></label>
      <div class="row">
        <button id="cfgTest" class="secondary">Test</button>
        <button id="cfgSave" class="primary">Save &amp; connect</button>
      </div>
      <p id="cfgMsg" class="msg"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
  <script src="app.js"></script>
</body>
</html>
