<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>held</title>
<style>
  :root{ --v:139 92 246; --p:236 72 153; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;pointer-events:none}
  /* Same face as the read-aloud toast, parked in a corner wearing a "!". Native owns the window and
     all touch handling (tap to read, drag to the X); this is purely the face. */
  #wrap{position:fixed;inset:0;opacity:0;transform:scale(.55);
    transition:transform .5s cubic-bezier(.2,1.5,.4,1), opacity .35s ease}
  #wrap.show{opacity:1;transform:scale(1)}
  #face{position:absolute;inset:0;width:100%;height:100%}

  /* the "!" chip — violet→magenta, with the backlog count once there's more than one */
  #bang{position:absolute;z-index:3;top:11%;right:9%;min-width:21px;height:21px;padding:0 6px;
    border-radius:999px;display:flex;align-items:center;justify-content:center;gap:2px;
    font:700 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
    background:linear-gradient(135deg,rgb(var(--v)),rgb(var(--p)));
    box-shadow:0 2px 10px rgb(var(--p)/.5), inset 0 1px 0 rgba(255,255,255,.28);
    border:1px solid rgba(255,255,255,.22);
    transition:opacity .2s ease, transform .2s ease}
  #bang .n{font-size:10px;opacity:.95}
  #wrap.reading #bang{opacity:0;transform:scale(.6)}   /* it's talking now — the "!" has done its job */
  #wrap.busy{animation:shake .45s ease}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
</style></head>
<body>
  <div id="wrap">
    <canvas id="face"></canvas>
    <span id="bang">!<span class="n" id="cnt"></span></span>
  </div>
<script src="eyes.js"></script>
<script>
  var wrap = document.getElementById('wrap'), cnt = document.getElementById('cnt');
  var qs = new URLSearchParams(location.search);
  var face = AsmltrEyes.mount(document.getElementById('face'),
    { palette: window.__ASMLTR_PALETTE || ['139,92,246', '236,72,153'] });

  requestAnimationFrame(function () { requestAnimationFrame(function () { wrap.classList.add('show'); }); });

  // Count of 1 shows a bare "!" — the number only earns its space once there's a backlog.
  window.setCount = function (n) { cnt.textContent = (n > 1) ? String(n) : ''; };

  var busyTimer = null;
  window.setState = function (s) {
    wrap.classList.remove('reading', 'busy');
    if (s === 'busy') {                       // tapped, but a call is still up
      wrap.classList.add('busy');
      face.setMood('concerned'); face.setState('idle');
      clearTimeout(busyTimer);
      busyTimer = setTimeout(function () { wrap.classList.remove('busy'); face.setMood('neutral'); }, 900);
      return;
    }
    if (s === 'reading') { wrap.classList.add('reading'); face.setMood('neutral'); face.setState('speaking'); return; }
    if (s === 'drag') { face.setMood('curious'); face.setState('idle'); return; }
    face.setMood('neutral'); face.setState('idle');   // waiting to be noticed
  };

  window.setAmp = function (v) { try { face.setAmp(v); } catch (e) {} };
  window.setPalette = function (a, b) { try { face.setPalette([a, b]); } catch (e) {} };

  window.setCount(parseInt(qs.get('n') || '1', 10) || 1);
</script>
</body></html>
