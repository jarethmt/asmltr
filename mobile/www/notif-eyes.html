<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>eyes</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;pointer-events:none}
  /* The canvas fills the whole overlay window. AsmltrEyes reserves its own padding for the glow, so
     the halo fades out inside the canvas instead of being clipped by the window edge — which is
     exactly what the old CSS `filter: blur(26px)` version could not do. */
  #face{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity .38s ease}
  #face.show{opacity:1}
  #face.out{opacity:0}
</style></head>
<body>
  <canvas id="face"></canvas>
<script src="eyes.js"></script>
<script>
  var el = document.getElementById('face');
  var face = AsmltrEyes.mount(el, { palette: window.__ASMLTR_PALETTE || ['139,92,246', '236,72,153'] });
  face.setState('speaking');   // this overlay only exists while something is being read aloud
  requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('show'); }); });

  // Native hooks (called via evaluateJavascript from NotifEyesOverlay).
  window.setAmp = function (v) { try { face.setAmp(v); } catch (e) {} };      // live TTS envelope
  window.setEyeState = function (s) { try { face.setState(s); } catch (e) {} };
  window.setEyeMood = function (m) { try { face.setMood(m); } catch (e) {} };
  window.setPalette = function (a, b) { try { face.setPalette([a, b]); } catch (e) {} };
  window.dismissEyes = function () { el.classList.add('out'); el.classList.remove('show'); };
</script>
</body></html>
