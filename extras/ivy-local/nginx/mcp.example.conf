# Example host nginx (reverse proxy only) for a dedicated MCP origin.
# Copy, set server_name to your host, point proxy_pass at the local MCP bind.
# Do not commit a live server_name.

server {
        listen 80;
        listen [::]:80;
        server_name mcp.example.com;

	charset UTF-8;
	gzip off;  # SSE: do not inherit http{} gzip on
	client_max_body_size 1m;

        location / {
                proxy_pass              http://127.0.0.1:3018;
                proxy_http_version      1.1;
                proxy_buffering         off;
                proxy_request_buffering off;
                proxy_cache             off;
                gzip                    off;
                proxy_read_timeout      15m;
                proxy_send_timeout      15m;
                proxy_set_header        Connection        "";
                proxy_set_header        Host              $host;
                proxy_set_header        X-Real-IP         $remote_addr;
                proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_set_header        X-Forwarded-Host  $host;
        }
}
