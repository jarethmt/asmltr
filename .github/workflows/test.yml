name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Unpinned from 24.18.0 now that better-sqlite3 is on 13.x (N-API, PR #120). The pin worked
          # around Node 24.19.0's ObjectWrap cleanup-hook regression, which only reaches NAN-style
          # addons; an N-API build never calls RemoveEnvironmentCleanupHook, so the assert cannot fire.
          # Keeping the pin would have left the host's own 24.19 exposure untested, which is the case
          # #120 was actually about — the core loads better-sqlite3 under pm2, not just CI.
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run tests
        run: npm test
